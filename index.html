<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太阳系公转演示</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>太阳系公转演示（行星 + 卫星）</h1>
      <p>
        这是给小朋友看的动态模型：九大行星围绕太阳公转；每颗行星的卫星（示意）围绕行星公转。
        可以调节速度、暂停和继续，观察谁转得快、谁转得慢。
      </p>

      <div class="controls">
        <label>
          公转速度
          <input id="speed" type="range" min="0.2" max="4" value="1" step="0.1" />
          <span id="speedLabel">1.0x</span>
        </label>
        <button id="toggle">暂停</button>
        <button id="reset">重置视角</button>
      </div>

      <ul id="legend" class="legend"></ul>
    </section>

    <section class="canvas-wrap">
      <canvas id="solarCanvas" width="1100" height="760" aria-label="太阳系公转示意图"></canvas>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
